<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded YouTube Video</title>
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src https://www.youtube.com; frame-ancestors https://teams.microsoft.com; script-src 'self'; style-src 'self';">
</head>
<body>
    <h1>Embedded YouTube Video</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/f29thX-pwZA?si=j6PRzZXhbYF1_1VD&amp;controls=0" 
        title="YouTube video player" frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
    </iframe>
</body>
</html>
